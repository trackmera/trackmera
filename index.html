    <script>
        // 1. Azərbaycanın rayonlarının və Bakı kəndlərinin dəqiq koordinat bazası
        const azerbaycanBazasi = {
            "merdekan": { ad: "Mərdəkan", lat: 40.4922, lng: 50.1383 },
            "suvelan": { ad: "Şüvəlan", lat: 40.4950, lng: 50.2039 },
            "bilgeh": { ad: "Bilgəh", lat: 40.5817, lng: 50.1656 },
            "mastaga": { ad: "Maştağa", lat: 40.5283, lng: 50.0108 },
            "nardaran": { ad: "Nardaran", lat: 40.5614, lng: 50.0108 },
            "hovsan": { ad: "Hövsan", lat: 40.3725, lng: 50.0814 },
            "bine": { ad: "Binə", lat: 40.4131, lng: 50.0856 },
            "zabrat": { ad: "Zabrat", lat: 40.4858, lng: 49.9547 },
            "sabuncu": { ad: "Sabunçu", lat: 40.4283, lng: 49.9500 },
            "ramana": { ad: "Ramanı", lat: 40.4619, lng: 49.9881 },
            "novxani": { ad: "Novxanı", lat: 40.5311, lng: 49.7758 },
            "masazir": { ad: "Masazır", lat: 40.4897, lng: 49.7542 },
            "lokbatan": { ad: "Lökbatan", lat: 40.3253, lng: 49.7364 },
            "buzovna": { ad: "Buzovna", lat: 40.5294, lng: 50.1206 },
            "qala": { ad: "Qala", lat: 40.4431, lng: 50.1689 },
            "bileceri": { ad: "Biləcəri", lat: 40.4464, lng: 49.8047 },
            "az1020": { ad: "Salyan (AZ1020)", lat: 39.5960, lng: 48.9841 },
            "salyan": { ad: "Salyan", lat: 39.5960, lng: 48.9841 },
            "az1000": { ad: "Bakı (Mərkəz)", lat: 40.4093, lng: 49.8671 },
            "baki": { ad: "Bakı", lat: 40.4093, lng: 49.8671 },
            "baku": { ad: "Bakı", lat: 40.4093, lng: 49.8671 },
            "az9000": { ad: "Gəncə", lat: 40.6828, lng: 46.3606 },
            "gence": { ad: "Gəncə", lat: 40.6828, lng: 46.3606 },
            "az4200": { ad: "Lənkəran", lat: 38.7543, lng: 48.8502 },
            "lenkeran": { ad: "Lənkəran", lat: 38.7543, lng: 48.8502 },
            "az5500": { ad: "Şəki", lat: 41.1919, lng: 47.1706 },
            "seki": { ad: "Şəki", lat: 41.1919, lng: 47.1706 },
            "az5600": { ad: "Şamaxı", lat: 40.6319, lng: 48.6414 },
            "samaxi": { ad: "Şamaxı", lat: 40.6319, lng: 48.6414 }
        };

        // Sabit Mərkəzi Anbar (Bakı) koordinatı
        const bakiAnbar = { lat: 40.4093, lng: 49.8671, ad: "Mərkəzi Anbar (Bakı)" };

        // 2. Google Sheets Test Verilənləri (Sheets-dən gələn dataların simulyasiyası)
        // Sheets-i bağlayanda bu verilənlər birbaşa sheets vərəqindən oxunacaq
        const sifarislərBaza = {
            "707804334": {
                ad: "Əziz Hacıyev",
                mehsul: "Pandora Ulduz",
                status: "Poçtda", // Hazırlanır, Yoldadır, Poçtda, Təhvil aldı
                f_sutunu: "Salyan", // Salyan və ya AZ1020 yazılacaq ünvan
                qeyd: "Bağlamanız təhlükəsiz şəkildə təyin olunmuş poçt filialına çatdı. Şəxsiyyət vəsiqənizlə yaxınlaşıb götürə bilərsiniz. 📦"
            },
            "505555555": {
                ad: "Emin Bağırov",
                mehsul: "Zərif Qolbaq",
                status: "Yoldadır",
                f_sutunu: "Mərdəkan",
                qeyd: "Sifarişiniz kuryer tərəfindən Mərkəzi Anbardan təhvil alındı, hədəf poçt şöbəsinə doğru hərəkətdədir. 🚚"
            }
        };

        // 3. Xəritənin təməl qurulması
        let map = null;
        let musteriMarker = null;
        let kuryerXetti = null;

        function initMap() {
            if (map !== null) return; // Əgər xəritə artıq qurulubsa, yenidən qurmasın

            map = L.map('map', {
                zoomControl: false,
                scrollWheelZoom: true
            }).setView([bakiAnbar.lat, bakiAnbar.lng], 9);

            // Sənin premium tünd saytına uyğun xüsusi tünd xəritə örtüyü (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; Mera Store',
                maxZoom: 20
            }).addTo(map);

            // Xüsusi estetik marker dizaynları
            const createSvgMarker = (color) => {
                return L.divIcon({
                    html: `<svg class="w-8 h-8 filter drop-shadow-md" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 21C16 16.8 18 13 18 10C18 6.13401 14.866 3 12 3C9.13401 3 6 6.13401 6 10C6 13 8 16.8 12 21Z" fill="${color}" stroke="#fff" stroke-width="1"/>
                            <circle cx="12" cy="10" r="3.5" fill="#fff"/>
                           </svg>`,
                    className: "",
                    iconSize: [28, 28],
                    iconAnchor: [14, 28]
                });
            };

            // Mərkəzi anbar Bakı (Qırmızı sabit nöqtə)
            L.marker([bakiAnbar.lat, bakiAnbar.lng], { icon: createSvgMarker('#ef4444') }).addTo(map)
                .bindPopup(`<b style="color:#000;">Mərkəzi Anbar (Bakı)</b>`);
        }

        // 4. Sifarişi axtarıb tapmaq üçün əsas funksiya
        function findOrder() {
            const inputNo = document.getElementById("orderSearchInput").value.trim();
            const order = sifarislərBaza[inputNo];

            if (order) {
                // Sifariş Kartını göstər
                document.getElementById("orderCard").style.display = "block";
                document.getElementById("map-container").style.display = "block";
                
                // Xəritəni dərhal işə sal
                initMap();

                // Müştəri məlumatlarını karta yazdırırıq
                document.getElementById("custName").innerText = order.ad;
                document.getElementById("custProduct").innerText = order.mehsul;
                document.getElementById("custStatus").innerText = order.status;
                document.getElementById("custNote").innerText = order.qeyd;

                // Status sətirinin addım-addım tənzimlənməsi
                updateStatusProgress(order.status);

                // XƏRİTƏNİ HƏRƏKƏT ETDİRMƏK VƏ F SÜTUNUNU İŞARƏLƏMƏK
                let locKey = order.f_sutunu.trim().toLowerCase();
                // Hərflərin normalizasiyası
                locKey = locKey.replace(/ə/g, 'e').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ı/g, 'i');

                if (azerbaycanBazasi[locKey]) {
                    const targetLoc = azerbaycanBazasi[locKey];

                    // Əvvəlki köhnə müştəri marker və marşrutlarını silirik
                    if (musteriMarker) map.removeLayer(musteriMarker);
                    if (kuryerXetti) map.removeLayer(kuryerXetti);

                    // Yeni hədəf poçt markerini əlavə edirik (Qızılı/Sarı rəngdə)
                    const createSvgMarker = (color) => {
                        return L.divIcon({
                            html: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;">
                                    <path d="M12 21C16 16.8 18 13 18 10C18 6.13401 14.866 3 12 3C9.13401 3 6 6.13401 6 10C6 13 8 16.8 12 21Z" fill="${color}" stroke="#fff" stroke-width="1"/>
                                    <circle cx="12" cy="10" r="3.5" fill="#fff"/>
                                   </svg>`,
                            className: "",
                            iconSize: [28, 28],
                            iconAnchor: [14, 28]
                        });
                    };

                    musteriMarker = L.marker([targetLoc.lat, targetLoc.lng], { icon: createSvgMarker('#eab308') }).addTo(map)
                        .bindPopup(`<b style="color:#000;">Poçt: ${targetLoc.ad}</b>`)
                        .openPopup();

                    // Əgər status "Yoldadır" və ya "Poçtda" olarsa Bakıdan hədəfə yol (marşrut) çəkir
                    if (order.status === "Yoldadır" || order.status === "Poçtda") {
                        const pathCoords = [
                            [bakiAnbar.lat, bakiAnbar.lng],
                            [targetLoc.lat, targetLoc.lng]
                        ];

                        kuryerXetti = L.polyline(pathCoords, {
                            color: '#eab308', // Qızılı rəngli marşrut xətti
                            weight: 3,
                            dashArray: '5, 8'
                        }).addTo(map);

                        // Xəritəni hər iki nöqtəni sığdıracaq şəkildə böyüdür
                        const bounds = L.latLngBounds(pathCoords);
                        map.fitBounds(bounds, { padding: [30, 30] });
                    } else {
                        // Əgər digər statuslardırsa birbaşa hədəf nöqtəyə fokal fokuslanır
                        map.setView([targetLoc.lat, targetLoc.lng], 12);
                    }
                }
            } else {
                alert("Daxil edilən nömrəyə uyğun aktiv sifariş tapılmadı!");
            }
        }

        // 5. Addım barın statusa uyğun qızılı rənglə dolması funksiyası
        function updateStatusProgress(status) {
            const steps = ["Hazırlanır", "Yoldadır", "Poçtda", "Təhvil aldı"];
            const statusIdx = steps.indexOf(status);

            // Bütün addımların təmizlənməsi
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`step${i}`).classList.remove("active");
            }

            // Aktiv status addımlarının rənglənməsi
            for (let i = 0; i <= statusIdx; i++) {
                document.getElementById(`step${i+1}`).classList.add("active");
            }

            // Qızılı xəttin irəliləmə faizi
            const progressWidths = [0, 33, 66, 100];
            document.getElementById("statusProgress").style.width = `${progressWidths[statusIdx]}%`;
        }
    </script>
