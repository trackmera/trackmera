<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store | Sifariş İzləmə Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --input-border: #222e45;
            --button-hover: #b5942e;
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Arxa fondakı estetik işıq effektləri */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            filter: blur(80px);
            bottom: 10%;
            right: 10%;
            z-index: -1;
        }

        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .logo-area span {
            color: var(--accent-gold);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-main);
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--accent-gold);
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            display: none;
            color: var(--error-red);
            margin-top: 20px;
            font-weight: 500;
            font-size: 14px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 10px;
            border-left: 4px solid var(--error-red);
        }

        .result-card {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid var(--success-green);
            text-align: left;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card h3 {
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-line {
            margin-bottom: 12px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-line strong {
            color: var(--text-muted);
            font-weight: 500;
        }

        .result-line span {
            color: var(--text-main);
            font-weight: 600;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green) !important;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .post-link {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 14px;
            background: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .post-link:hover {
            background: rgba(56, 189, 248, 0.1);
            transform: scale(1.02);
        }

        /* Sosial Media Düymələri */
        .social-footer {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .social-icon {
            color: var(--text-muted);
            font-size: 22px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent-gold);
            transform: translateY(-3px);
        }

        /* WhatsApp Düyməsinin Dizaynı */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #fff;
            border-radius: 50px;
            text-align: center;
            font-size: 35px;
            box-shadow: 0px 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) rotate(10deg);
            background-color: #20ba5a;
            color: #fff;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @media screen and (max-width: 768px) {
            .whatsapp-float {
                bottom: 20px;
                right: 20px;
                width: 55px;
                height: 55px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">MERA <span>STORE</span></div>
    <p class="subtitle">Sifariş statusunuzu canlı izləmək üçün qeydiyyat nömrənizi daxil edin.</p>
    
    <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 0993999338)">
    </div>
    
    <button onclick="checkStatus()">Sifarişi Tap <i class="fa-solid fa-magnifying-glass" style="margin-left: 5px;"></i></button>

    <div class="error" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation" style="margin-right: 5px;"></i> Aktiv sifariş tapılmadı. Zəhmət olmasa nömrəni düzgün yazdığınızdan əmin olun.
    </div>

    <div class="result-card" id="resultCard">
        <h3><i class="fa-solid fa-box-open" style="color: var(--accent-gold);"></i> <span id="resName">Müştəri Adı</span></h3>
        
        <div class="result-line">
            <strong>Məhsul:</strong>
            <span id="resProduct">-</span>
        </div>
        <div class="result-line">
            <strong>Statusu:</strong>
            <span id="resStatus" class="status-badge">-</span>
        </div>
        <div class="result-line" id="trackTextAlani" style="display: none;">
            <strong>Poçt Kodu:</strong>
            <span id="resTrackCode">-</span>
        </div>
        
        <div id="poctAlani"></div>
    </div>

    <div class="social-footer">
        <a href="https://instagram.com/merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
    </div>
</div>

<a href="https://wa.me/994705849113" class="whatsapp-float" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    // Enter düyməsinə basanda avtomatik axtarış funksiyası
    document.getElementById('phoneInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkStatus();
        }
    });

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

    function checkStatus() {
        const inputVal = document.getElementById('phoneInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');

        if (!inputVal) return;

        const klaviaturadanYazilan = temizleNo(inputVal);

        fetch(BASE_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                
                let found = false;

                for (let row of rows) {
                    if (!row.c[0]) continue;
                    
                    const cedveldekiNo = temizleNo(row.c[0].v);
                    
                    if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                        document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                        document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                        document.getElementById('resStatus').innerText = row.c[4] ? row.c[4].v : 'Yoxlanılır'; 
                        
                        if (row.c[3] && row.c[3].v) {
                            const trackCode = row.c[3].v.toString().trim();
                            resTrackCode.innerText = trackCode;
                            trackTextAlani.style.display = 'flex';
                            
                            poctAlani.innerHTML = `<a href="https://www.azerpost.az/az/xidmetler/gonderislerin-izlenmesi?package_id=${trackCode}#packageFollow" target="_blank" class="post-link"><i class="fa-solid fa-truck-ramp-box"></i> Azərpoçt ilə Canlı İzlə</a>`;
                        } else {
                            trackTextAlani.style.display = 'none';
                            poctAlani.innerHTML = '';
                        }
                        
                        resultCard.style.display = 'block';
                        errorMsg.style.display = 'none';
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    resultCard.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                console.error(err);
                alert('Sistemdə xəta baş verdi.');
            });
    }
</script>

</body>
</html>
