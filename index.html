<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store | Sifariş İzləmə Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070a13;
            --card-bg: rgba(21, 28, 44, 0.6);
            --accent-gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --input-border: #1e293b;
            --button-hover: #b5942e;
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #070a13;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.65, 0, 0.35, 1), visibility 0.6s;
        }

        .loader-logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-main);
            animation: logoFade 1.6s infinite alternate ease-in-out;
        }

        .loader-logo span { color: var(--accent-gold); }

        @keyframes logoFade {
            0% { opacity: 0.3; transform: scale(0.97); filter: blur(2px); }
            100% { opacity: 1; transform: scale(1.02); filter: blur(0); }
        }

        .container {
            background: var(--card-bg);
            padding: 50px 35px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 410px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-area {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo-area span { color: var(--accent-gold); }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .input-group { position: relative; margin-bottom: 20px; }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(7, 10, 19, 0.4);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
        }

        input:focus { border-color: rgba(212, 175, 55, 0.5); }

        button {
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            display: none;
            color: var(--error-red);
            margin-top: 25px;
            padding: 14px;
            background: rgba(239, 68, 68, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            text-align: left;
        }

        .result-card {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-gold);
            text-align: left;
        }

        .result-card h3 {
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-line {
            margin-bottom: 14px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-line strong { color: var(--text-muted); font-weight: 400; }
        .result-line span { color: var(--text-main); font-weight: 500; }

        .status-badge {
            background: rgba(212, 175, 55, 0.08);
            color: var(--accent-gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .post-link {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 22px;
            padding: 14px;
            background: rgba(56, 189, 248, 0.05);
            color: #38bdf8;
            text-decoration: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .social-footer {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 25px;
        }

        .social-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; }
        .social-icon:hover { color: var(--accent-gold); }

        .whatsapp-float {
            position: fixed;
            width: 58px;
            height: 58px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0px 6px 20px rgba(37, 211, 102, 0.3);
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="loader-logo">MERA <span>STORE</span></div>
</div>

<div class="container">
    <div class="logo-area">MERA <span>STORE</span></div>
    <p class="subtitle">Sifariş statusunuzu canlı izləmək üçün qeydiyyat nömrənizi daxil edin.</p>
    
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 0993999338)">
        <i class="fa-solid fa-phone"></i>
    </div>
    
    <button onclick="checkStatus()" id="searchBtn">
        <span id="btnText">Sifarişi Tap</span>
        <i class="fa-solid fa-magnifying-glass" id="btnIcon"></i>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="error" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> Aktiv sifariş tapılmadı.
    </div>

    <div class="result-card" id="resultCard">
        <h3><i class="fa-solid fa-box-open" style="color: var(--accent-gold);"></i> <span id="resName">Müştəri Adı</span></h3>
        
        <div class="result-line">
            <strong>Məhsul:</strong>
            <span id="resProduct">-</span>
        </div>
        <div class="result-line">
            <strong>Statusu:</strong>
            <span id="resStatus" class="status-badge">🔄 Canlı status oxunur...</span>
        </div>
        <div class="result-line" id="trackTextAlani" style="display: none;">
            <strong>Poçt Kodu:</strong>
            <span id="resTrackCode">-</span>
        </div>
        
        <div id="poctAlani"></div>
    </div>

    <div class="social-footer">
        <a href="https://instagram.com/merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
    </div>
</div>

<a href="https://wa.me/994705849113" class="whatsapp-float" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
    function hidePreloader() {
        const preloader = document.getElementById('preloader');
        if (preloader) {
            preloader.style.opacity = '0';
            preloader.style.visibility = 'hidden';
        }
    }
    window.addEventListener('load', hidePreloader);
    setTimeout(hidePreloader, 2000);

    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    document.getElementById('phoneInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkStatus();
    });

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

function azerpostCanliFetch(poctKodu) {
    const statusBadge = document.getElementById('resStatus');
    const poctAlani = document.getElementById('poctAlani');
    
    statusBadge.innerHTML = "🔄 Canlı status oxunur...";
    statusBadge.style.color = "var(--accent-gold)";

    // 🚨 BURA ADDIM 1-DƏ GOOGLE-DAN ALDIĞIN WEB APP URL-SİNİ YAPIŞDIR!
    const googleScriptUrl = "https://script.google.com/macros/s/AKfycbyZz9y6_BMxXapHkJufyQw1GapAoVjI-2uUCAVSxC9N-oKwyTAibDCGB771lT2iPR0Jbw/exec" + poctKodu;

    fetch(googleScriptUrl)
        .then(res => res.json())
        .then(data => {
            if (data && data.status) {
                statusBadge.innerText = data.status;
                
                // Əgər çatdırılıbsa yaşıl rəng et
                if (data.status.includes("Çatdırılıb")) {
                    statusBadge.style.color = "var(--success-green)";
                    statusBadge.style.background = "rgba(16, 185, 129, 0.08)";
                    statusBadge.style.borderColor = "rgba(16, 185, 129, 0.15)";
                } else {
                    statusBadge.style.color = "var(--text-main)";
                    statusBadge.style.background = "rgba(255, 255, 255, 0.05)";
                    statusBadge.style.borderColor = "rgba(255, 255, 255, 0.1)";
                }
            }
            // Əlavə qırmızı düymə sahəsini gizlədirik, çünki artıq birbaşa avtomatik oxunur
            if (poctAlani) poctAlani.innerHTML = '';
        })
        .catch(err => {
            console.error(err);
            statusBadge.innerText = "📦 Sistemdə / Hazırlanır";
        });
}

    function checkStatus() {
        const inputVal = document.getElementById('phoneInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');
        
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        if (!inputVal) return;

        btnText.style.opacity = '0.5';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'block';

        const klaviaturadanYazilan = temizleNo(inputVal);

        fetch(BASE_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                let found = false;

                for (let row of rows) {
                    if (!row.c[0]) continue;
                    
                    const cedveldekiNo = temizleNo(row.c[0].v);
                    
                    if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                        document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                        document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                        
                        // Default olaraq Sheets-dəki statusu yazırıq
                        document.getElementById('resStatus').innerText = row.c[4] ? row.c[4].v : '🔄 Canlı status oxunur...';
                        document.getElementById('resStatus').style.color = "var(--accent-gold)";

                        if (row.c[3] && row.c[3].v) {
                            const trackCode = row.c[3].v.toString().trim();
                            resTrackCode.innerText = trackCode;
                            trackTextAlani.style.display = 'flex';
                            poctAlani.innerHTML = `<a href="https://www.azerpost.az/az/xidmetler/gonderislerin-izlenmesi?package_id=${trackCode}#packageFollow" target="_blank" class="post-link"><i class="fa-solid fa-truck-ramp-box"></i> Azərpoçt ilə Canlı İzlə</a>`;
                            
                            // CANLI METRIKA İŞƏ DÜŞDÜ
                            azerpostCanliFetch(trackCode);
                        } else {
                            trackTextAlani.style.display = 'none';
                            poctAlani.innerHTML = '';
                        }
                        
                        resultCard.style.display = 'block';
                        errorMsg.style.display = 'none';
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    resultCard.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(() => alert('Sistemdə xəta baş verdi.'))
            .finally(() => {
                btnText.style.opacity = '1';
                btnIcon.style.display = 'block';
                btnSpinner.style.display = 'none';
            });
    }
</script>

</body>
</html>
