<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store - Sifariş Statusu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 90%; max-width: 400px; }
        h2 { color: #333; margin-bottom: 5px; }
        p.subtitle { color: #777; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #222; }
        .result-card { display: none; margin-top: 25px; padding: 20px; border-radius: 12px; background: #fafafa; border-left: 5px solid #00c853; text-align: left; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .result-card h3 { margin: 0 0 10px 0; color: #222; font-size: 18px; }
        .result-card p { margin: 5px 0; color: #555; font-size: 15px; }
        .error { display: none; color: #ff3d00; margin-top: 15px; font-weight: 500; }
        .post-link { display: inline-block; margin-top: 12px; padding: 10px 14px; background: #0052cc; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: bold; width: 100%; box-sizing: border-box; text-align: center; }
        .post-link:hover { background: #003d99; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mera Store ✨</h2>
    <p class="subtitle">Sifariş statusunuzu yoxlamaq üçün telefon nömrənizi daxil edin</p>
    
    <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 099 399 93 38)">
    <button onclick="checkStatus()">Yoxla</button>

    <div class="error" id="errorMsg">Ooops! Bu nömrə ilə aktiv sifariş tapılmadı.</div>

    <div class="result-card" id="resultCard">
        <h3 id="resName">Müştəri Adı</h3>
        <p><strong>Məhsul:</strong> <span id="resProduct">-</span></p>
        <p><strong>Status:</strong> <span id="resStatus">-</span></p>
        <p id="trackTextAlani" style="display: none;"><strong>AzerPost kodu:</strong> <span id="resTrackCode">-</span></p>
        <div id="poctAlani"></div>
    </div>
</div>

<script>
    // GitHub keşini qırmaq və canlı yeniləmək üçün versiya: v1.0.3
    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

    function checkStatus() {
        const inputVal = document.getElementById('phoneInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');

        if (!inputVal) return;

        const klaviaturadanYazilan = temizleNo(inputVal);

        fetch(BASE_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                
                let found = false;

                for (let row of rows) {
                    if (!row.c[0]) continue;
                    
                    const cedveldekiNo = temizleNo(row.c[0].v);
                    
                    if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                        document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                        document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                        
                        // E sütunu = Status
                        document.getElementById('resStatus').innerText = row.c[4] ? row.c[4].v : 'Yoxlanılır'; 
                        
                        // D sütunu = Poçt Kodu
                        if (row.c[3] && row.c[3].v) {
                            const trackCode = row.c[3].v.toString().trim();
                            resTrackCode.innerText = trackCode;
                            trackTextAlani.style.display = 'block';
                            
                            // Birbaşa avtomatik işləyən rəsmi Azərpoçt linki
                            poctAlani.innerHTML = `<a href="https://azerpost.az/az/tracking?trackID=${trackCode}" target="_blank" class="post-link">Azərpoçt ilə Canlı İzlə 📦</a>`;
                        } else {
                            trackTextAlani.style.display = 'none';
                            poctAlani.innerHTML = '';
                        }
                        
                        resultCard.style.display = 'block';
                        errorMsg.style.display = 'none';
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    resultCard.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                console.error(err);
                alert('Sistemdə xəta baş verdi.');
            });
    }
</script>

</body>
</html>
