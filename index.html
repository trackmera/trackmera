<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store | Sifariş İzləmə Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #03050a;
            --card-bg: rgba(10, 15, 28, 0.8);
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --input-border: #1e293b;
            --button-hover: #b5942e;
            --success-green: #10b981;
            --error-red: #ef4444;
            --cyber-blue: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ✨ CANLI SƏMA FONU (CANVAS) STİLİ */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 🔥 EFFEKTLİ VƏ SÜRƏTLİ AÇILIŞ (PRELOADER) */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #03050a;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .loader-logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--text-main);
            text-shadow: 0 0 20px var(--gold-glow);
            animation: logoIntro 1.2s ease-in-out forwards;
        }

        .loader-logo span { color: var(--accent-gold); }

        @keyframes logoIntro {
            0% { opacity: 0; transform: scale(0.8); filter: blur(10px); letter-spacing: 12px; }
            50% { opacity: 1; filter: blur(0); letter-spacing: 6px; }
            100% { opacity: 0; transform: scale(1.1); filter: blur(4px); }
        }

        .container {
            background: var(--card-bg);
            padding: 45px 30px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 100%;
            max-width: 410px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: relative;
            z-index: 10;
        }

        .logo-area {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo-area span { color: var(--accent-gold); }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .input-group { position: relative; margin-bottom: 25px; }

        .input-group i.phone-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .clear-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: none;
            transition: color 0.2s;
        }
        .clear-icon:hover { color: var(--error-red); }

        input {
            width: 100%;
            padding: 16px 40px 16px 48px;
            background: rgba(3, 5, 10, 0.6);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        button.search-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b5942e 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }

        button.search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* 💡 MERA STORE MOTİVASİYA YAZISI */
        .quote-loader {
            display: none;
            font-size: 12px;
            color: var(--accent-gold);
            margin-top: 15px;
            font-style: italic;
            animation: pulseText 1s infinite alternate;
        }

        @keyframes pulseText { from { opacity: 0.5; } to { opacity: 1; } }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            display: none;
            color: var(--error-red);
            margin-top: 25px;
            padding: 14px;
            background: rgba(239, 68, 68, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            text-align: left;
            font-size: 13px;
        }

        .result-card {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--accent-gold);
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-card h3 {
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 📍 SİFARİŞ MƏRHƏLƏLƏRİ (TIMELINE) */
        .timeline {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 5px;
            right: 5px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1;
        }

        .timeline-progress {
            position: absolute;
            top: 10px;
            left: 5px;
            height: 2px;
            background: var(--accent-gold);
            z-index: 2;
            width: 0%;
            transition: width 0.8s ease-in-out;
        }

        .step {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            width: 25%;
        }

        .step .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #111827;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            transition: all 0.4s;
        }

        .step.active .dot {
            border-color: var(--accent-gold);
            background: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .step.active span {
            color: var(--text-main);
            font-weight: 600;
        }

        .result-line {
            margin-bottom: 14px;
            font-size: 13.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-line strong { color: var(--text-muted); font-weight: 400; }
        .result-line span { color: var(--text-main); font-weight: 500; }

        .status-badge {
            background: rgba(212, 175, 55, 0.06);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .copy-btn {
            margin-left: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .copy-btn:hover { color: var(--cyber-blue); }

        /* 💎 PREMIUM NEON AZƏRPOÇT DÜYMƏSİ */
        .post-link {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            padding: 16px;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .post-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .post-link:hover::before { left: 100%; }

        .post-link:hover {
            background: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            transform: scale(1.02);
        }

        /* 📲 SOSİAL ŞƏBƏKƏ ANIMASİYALI İKONLARI */
        .social-footer {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 25px;
        }

        .social-icon { 
            color: var(--text-muted); 
            font-size: 22px; 
            text-decoration: none; 
            transition: all 0.3s ease;
        }
        
        .social-icon:hover { 
            color: var(--accent-gold); 
            transform: translateY(-3px) scale(1.2);
            text-shadow: 0 0 15px var(--accent-gold);
        }

        .whatsapp-float {
            position: fixed;
            width: 58px;
            height: 58px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0px 6px 20px rgba(37, 211, 102, 0.3);
            z-index: 9999;
            transition: transform 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="preloader">
    <div class="loader-logo">MERA <span>STORE</span></div>
</div>

<div class="container">
    <div class="logo-area">MERA <span>STORE</span></div>
    <p class="subtitle">Sifariş statusunuzu görmək üçün qeydiyyat nömrənizi daxil edin.</p>
    
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 0993999338)">
        <i class="fa-solid fa-phone phone-icon"></i>
        <i class="fa-solid fa-xmark clear-icon" id="clearBtn" onclick="clearInput()"></i>
    </div>
    
    <button onclick="checkStatus()" id="searchBtn" class="search-btn">
        <span id="btnText">Sifarişi Tap</span>
        <i class="fa-solid fa-magnifying-glass" id="btnIcon"></i>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="quote-loader" id="quoteLoader">Mera Store ilə parıltınız heç vaxt sönməsin... ✨</div>

    <div class="error" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> Aktiv sifariş tapılmadı.
    </div>

    <div class="result-card" id="resultCard">
        
        <div class="timeline">
            <div class="timeline-progress" id="timelineProgress"></div>
            <div class="step" id="step1"><div class="dot">1</div><span>Hazırlanır</span></div>
            <div class="step" id="step2"><div class="dot">2</div><span>Yoldadır</span></div>
            <div class="step" id="step3"><div class="dot">3</div><span>Poçtda</span></div>
            <div class="step" id="step4"><div class="dot">4</div><span>Çatdı</span></div>
        </div>

        <h3><i class="fa-solid fa-box-open" style="color: var(--accent-gold);"></i> <span id="resName">Müştəri Adı</span></h3>
        
        <div class="result-line">
            <strong>Məhsul:</strong>
            <span id="resProduct">-</span>
        </div>
        <div class="result-line">
            <strong>Statusu:</strong>
            <span id="resStatus" class="status-badge">-</span>
        </div>
        <div class="result-line" id="trackTextAlani" style="display: none;">
            <strong>Poçt Kodu:</strong>
            <div>
                <span id="resTrackCode">-</span>
                <i class="fa-regular fa-copy copy-btn" onclick="copyTrackCode()" title="Kopyala"></i>
            </div>
        </div>
        
        <div id="poctAlani"></div>
    </div>

    <div class="social-footer">
        <a href="https://instagram.com/merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
    </div>
</div>

<a href="https://wa.me/994705849113" class="whatsapp-float" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
    // 🔊 FUTURİSTİK BİLDİRİŞ SƏSİ (AUDIO DATA URI)
    const successSound = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAQA");
    // Qeyd: Yuxarıdakı səs brauzeri yormayan, ultra qısa modern kiber bip effektidir.

    // ✨ CANLI SƏMA FONU (STARFIELD CANVAS EFFECT)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i=0; i<60; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            color: Math.random() > 0.5 ? '#d4af37' : '#00f0ff',
            speed: Math.random() * 0.2 + 0.05
        });
    }

    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
            ctx.fillStyle = star.color;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
            ctx.fill();
            star.y += star.speed;
            if(star.y > canvas.height) star.y = 0;
        });
        requestAnimationFrame(animateStars);
    }
    animateStars();

    // PRELOADER AYARI (1.1 saniyə sonra dərhal itir)
    window.addEventListener('load', () => {
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';
            }
        }, 1100);
    });

    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    const phoneInput = document.getElementById('phoneInput');
    const clearBtn = document.getElementById('clearBtn');
    const quoteLoader = document.getElementById('quoteLoader');

    // MERA STORE PREMİUM MESAJLARI
    const meraQuotes = [
        "Mera Store ilə parıltınız heç vaxt sönməsin... ✨",
        "Zəriflik detallarda gizlidir, yüklənir... 💎",
        "Sizin üçün ən dəyərlisini hazırlayırıq... 📦",
        "Mera kolleksiyasından sizə özəl bir bağlama... 🌟"
    ];

    phoneInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkStatus();
    });

    phoneInput.addEventListener('input', function() {
        clearBtn.style.display = this.value.trim().length > 0 ? 'block' : 'none';
    });

    function clearInput() {
        phoneInput.value = '';
        clearBtn.style.display = 'none';
        phoneInput.focus();
    }

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

    function copyTrackCode() {
        const code = document.getElementById('resTrackCode').innerText;
        navigator.clipboard.writeText(code).then(() => {
            alert('Poçt kodu kopyalandı: ' + code);
        });
    }

    // 📍 TIMELINE (MƏRHƏLƏ) AYARLAYICI FUNKSİYA
    function updateTimeline(statusText) {
        const p = document.getElementById('timelineProgress');
        const s1 = document.getElementById('step1');
        const s2 = document.getElementById('step2');
        const s3 = document.getElementById('step3');
        const s4 = document.getElementById('step4');

        // Bütün mərhələləri sıfırla
        [s1, s2, s3, s4].forEach(s => s.classList.remove('active'));
        p.style.width = "0%";

        const txt = statusText.toLowerCase();

        if (txt.includes("hazırlanır") || txt.includes("sifariş alındı")) {
            s1.classList.add('active');
            p.style.width = "12.5%";
        } else if (txt.includes("yolda") || txt.includes("kuryer") || txt.includes("göndərildi")) {
            s1.classList.add('active'); s2.classList.add('active');
            p.style.width = "50%";
        } else if (txt.includes("poçt") || txt.includes("filial") || txt.includes("məntəqə")) {
            s1.classList.add('active'); s2.classList.add('active'); s3.classList.add('active');
            p.style.width = "75%";
        } else if (txt.includes("çatdı") || txt.includes("təhvil") || txt.includes("çatdırıldı")) {
            s1.classList.add('active'); s2.classList.add('active'); s3.classList.add('active'); s4.classList.add('active');
            p.style.width = "100%";
        } else {
            // Əgər spesifik bir şey yazılmayıbsa, avtomatik 1-ci pilləni aktiv et
            s1.classList.add('active');
            p.style.width = "12.5%";
        }
    }

    function checkStatus() {
        const inputVal = phoneInput.value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');
        
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        if (!inputVal) return;

        // Düyməni kilidlə və təsadüfi bir Mera Store sitatı çıxar
        btnText.style.opacity = '0.5';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'block';
        quoteLoader.innerText = meraQuotes[Math.floor(Math.random() * meraQuotes.length)];
        quoteLoader.style.display = 'block';

        const klaviaturadanYazilan = temizleNo(inputVal);

        fetch(BASE_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                let found = false;

                for (let row of rows) {
                    if (!row.c[0]) continue;
                    
                    const cedveldekiNo = temizleNo(row.c[0].v);
                    
                    if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                        // Səs effektini çal
                        try { successSound.play(); } catch(e){}

                        document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                        document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                        
                        const cədvəlStatusu = row.c[4] ? row.c[4].v : '📦 Hazırlanır';
                        document.getElementById('resStatus').innerText = cədvəlStatusu;

                        // Canlı olaraq Sifariş Mərhələ xəttini yenilə
                        updateTimeline(cədvəlStatusu);

                        if (row.c[3] && row.c[3].v) {
                            const trackCode = row.c[3].v.toString().trim();
                            if (resTrackCode) resTrackCode.innerText = trackCode;
                            if (trackTextAlani) trackTextAlani.style.display = 'flex';
                            
                            if (poctAlani) {
                                poctAlani.innerHTML = `<a href="https://www.azerpost.az/az/xidmetler/gonderislerin-izlenmesi?package_id=${trackCode}" target="_blank" class="post-link"><i class="fa-solid fa-truck-fast"></i> AzerPost Canlı İzlə</a>`;
                            }
                        } else {
                            if (trackTextAlani) trackTextAlani.style.display = 'none';
                            if (poctAlani) poctAlani.innerHTML = '';
                        }
                        
                        resultCard.style.display = 'block';
                        errorMsg.style.display = 'none';
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    resultCard.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            })
            .catch((err) => {
                console.error(err);
                alert('Sistemdə xəta baş verdi.');
            })
            .finally(() => {
                btnText.style.opacity = '1';
                btnIcon.style.display = 'block';
                btnSpinner.style.display = 'none';
                quoteLoader.style.display = 'none';
            });
    }
</script>

</body>
</html>
