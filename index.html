<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store | Sifariş İzləmə Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    
    <style>
        :root {
            --bg-color: #070a13;
            --card-bg: rgba(21, 28, 44, 0.6);
            --accent-gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --input-border: #1e293b;
            --button-hover: #b5942e;
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* İldırım sürətli preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #070a13;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.25s ease, visibility 0.25s;
        }

        .loader-logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            text-align: center;
            animation: logoPulse 1.2s infinite ease-in-out;
        }

        .loader-logo span {
            color: var(--accent-gold);
        }

        @keyframes logoPulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Arxa fon effektləri */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            filter: blur(90px);
            top: 10%;
            left: 5%;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 50%;
            filter: blur(90px);
            bottom: 10%;
            right: 5%;
            z-index: -1;
        }

        /* Şüşə qutu - Mobil üçün optimizasiya edildi */
        .container {
            background: var(--card-bg);
            padding: 45px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .logo-area {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo-area span {
            color: var(--accent-gold);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(7, 10, 19, 0.5);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.08);
        }

        input:focus + i {
            color: var(--accent-gold);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            display: none;
            color: var(--error-red);
            margin-top: 25px;
            font-weight: 500;
            font-size: 13px;
            padding: 14px;
            background: rgba(239, 68, 68, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            text-align: left;
        }

        .result-card {
            display: none;
            margin-top: 30px;
            padding: 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--accent-gold);
            text-align: left;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card h3 {
            margin-bottom: 18px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-line {
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-line strong {
            color: var(--text-muted);
            font-weight: 400;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.08);
            color: var(--success-green) !important;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .post-link {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 14px;
            background: rgba(56, 189, 248, 0.05);
            color: #38bdf8;
            text-decoration: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .social-footer {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
        }

        .social-icon {
            color: var(--text-muted);
            font-size: 20px;
            transition: color 0.2s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent-gold);
        }

        .whatsapp-float {
            position: fixed;
            width: 54px;
            height: 54px;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0px 4px 15px rgba(37, 211, 102, 0.3);
            animation: pulse 2s infinite;
        }

        .whatsapp-float i {
            font-size: 28px;
            color: #ffffff !important;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @media screen and (max-width: 768px) {
            .container {
                padding: 35px 20px;
            }
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="loader-logo">MERA <span>STORE</span></div>
</div>

<div class="container">
    <div class="logo-area">MERA <span>STORE</span></div>
    <p class="subtitle">Sifariş statusunuzu canlı izləmək üçün qeydiyyat nömrənizi daxil edin.</p>
    
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 0993999338)">
        <i class="fa-solid fa-phone"></i>
    </div>
    
    <button onclick="checkStatus()" id="searchBtn">
        <span id="btnText">Sifarişi Tap</span>
        <i class="fa-solid fa-magnifying-glass" id="btnIcon"></i>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="error" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> Aktiv sifariş tapılmadı. Zəhmət olmasa nömrəni düzgün yoxlayyn.
    </div>

    <div class="result-card" id="resultCard">
        <h3><i class="fa-solid fa-box-open" style="color: var(--accent-gold);"></i> <span id="resName">Müştəri Adı</span></h3>
        <div class="result-line"><strong>Məhsul:</strong> <span id="resProduct">-</span></div>
        <div class="result-line"><strong>Statusu:</strong> <span id="resStatus" class="status-badge">-</span></div>
        <div class="result-line" id="trackTextAlani" style="display: none;"><strong>Poçt Kodu:</strong> <span id="resTrackCode">-</span></div>
        <div id="poctAlani"></div>
    </div>

    <div class="social-footer">
        <a href="https://instagram.com/merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
    </div>
</div>

<a href="https://wa.me/994705849113" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

<script>
    // İldırım sürətli idarəetmə skripti
    function hidePreloader() {
        const preloader = document.getElementById('preloader');
        if (preloader && preloader.style.visibility !== 'hidden') {
            preloader.style.opacity = '0';
            preloader.style.visibility = 'hidden';
        }
    }

    // Səhifə oxunan kimi dərhal bağla
    window.addEventListener('DOMContentLoaded', hidePreloader);
    window.addEventListener('load', hidePreloader);

    // Maksimum gözləmə limiti cəmi 1 saniyə
    setTimeout(hidePreloader, 1000);

    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    document.getElementById('phoneInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkStatus();
    });

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

    function checkStatus() {
        const inputVal = document.getElementById('phoneInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');
        
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        if (!inputVal) return;

        btnText.style.opacity = '0.5';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'block';

        const klaviaturadanYazilan = temizleNo(inputVal);

        // Düymə animasiyasının hiss olunması üçün cəmi 200ms minimalist gecikmə
        setTimeout(() => {
            fetch(BASE_URL)
                .then(res => res.text())
                .then(data => {
                    const json = JSON.parse(data.substr(47).slice(0, -2));
                    const rows = json.table.rows;
                    let found = false;

                    for (let row of rows) {
                        if (!row.c[0]) continue;
                        const cedveldekiNo = temizleNo(row.c[0].v);
                        
                        if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                            document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                            document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                            document.getElementById('resStatus').innerText = row.c[4] ? row.c[4].v : 'Yoxlanılır'; 
                            
                            if (row.c[3] && row.c[3].v) {
                                const trackCode = row.c[3].v.toString().trim();
                                resTrackCode.innerText = trackCode;
                                trackTextAlani.style.display = 'flex';
                                poctAlani.innerHTML = `<a href="https://www.azerpost.az/az/xidmetler/gonderislerin-izlenmesi?package_id=${trackCode}#packageFollow" target="_blank" class="post-link"><i class="fa-solid fa-truck-ramp-box"></i> Azərpoçt ilə Canlı İzlə</a>`;
                            } else {
                                trackTextAlani.style.display = 'none';
                                poctAlani.innerHTML = '';
                            }
                            resultCard.style.display = 'block';
                            errorMsg.style.display = 'none';
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        resultCard.style.display = 'none';
                        errorMsg.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error(err);
                })
                .finally(() => {
                    btnText.style.opacity = '1';
                    btnIcon.style.display = 'block';
                    btnSpinner.style.display = 'none';
                });
        }, 200);
    }
</script>
</body>
</html>
