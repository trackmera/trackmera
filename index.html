<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Store | Sifariş İzləmə Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(13, 19, 33, 0.75);
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --input-border: #1e293b;
            --button-hover: #b5942e;
            --success-green: #10b981;
            --error-red: #ef4444;
            --cyber-blue: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 🔥 EFFEKTLİ VƏ SÜRƏTLİ AÇILIŞ (PRELOADER) */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #05070f;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .loader-logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--text-main);
            text-shadow: 0 0 20px var(--gold-glow);
            animation: logoIntro 1.2s ease-in-out forwards;
        }

        .loader-logo span { color: var(--accent-gold); }

        @keyframes logoIntro {
            0% { opacity: 0; transform: scale(0.8); filter: blur(10px); letter-spacing: 12px; }
            50% { opacity: 1; filter: blur(0); letter-spacing: 6px; }
            100% { opacity: 0; transform: scale(1.1); filter: blur(4px); }
        }

        .container {
            background: var(--card-bg);
            padding: 45px 30px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 100%;
            max-width: 410px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo-area {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo-area span { color: var(--accent-gold); }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .input-group { position: relative; margin-bottom: 25px; }

        .input-group i.phone-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        /* ❌ NÖMRƏNİ SİLƏN DÜYMƏ */
        .clear-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: none;
            transition: color 0.2s;
        }
        .clear-icon:hover { color: var(--error-red); }

        input {
            width: 100%;
            padding: 16px 40px 16px 48px;
            background: rgba(5, 7, 15, 0.6);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        button.search-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #b5942e 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }

        button.search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            display: none;
            color: var(--error-red);
            margin-top: 25px;
            padding: 14px;
            background: rgba(239, 68, 68, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            text-align: left;
            font-size: 13px;
        }

        .result-card {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--accent-gold);
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-card h3 {
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-line {
            margin-bottom: 14px;
            font-size: 13.5px;
            display: flex;
            justify-space: space-between;
            align-items: center;
            justify-content: space-between;
        }

        .result-line strong { color: var(--text-muted); font-weight: 400; }
        .result-line span { color: var(--text-main); font-weight: 500; }

        .status-badge {
            background: rgba(212, 175, 55, 0.06);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* 📋 KOPYALAMA İKONU STİLİ */
        .copy-btn {
            margin-left: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .copy-btn:hover { color: var(--cyber-blue); }

        /* 💎 YENİ KİBER-FUTURİSTİK AZƏRPOÇT DÜYMƏSİ */
        .post-link {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            padding: 16px;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .post-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.5s;
        }

        .post-link:hover::before { left: 100%; }

        .post-link:hover {
            background: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: scale(1.02);
        }

        .post-link i {
            font-size: 16px;
        }

        .social-footer {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 25px;
        }

        .social-icon { color: var(--text-muted); font-size: 20px; text-decoration: none; }
        .social-icon:hover { color: var(--accent-gold); }

        .whatsapp-float {
            position: fixed;
            width: 58px;
            height: 58px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0px 6px 20px rgba(37, 211, 102, 0.3);
            z-index: 9999;
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="loader-logo">MERA <span>STORE</span></div>
</div>

<div class="container">
    <div class="logo-area">MERA <span>STORE</span></div>
    <p class="subtitle">Sifariş statusunuzu görmək üçün qeydiyyat nömrənizi daxil edin.</p>
    
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Nömrənizi yazın (Məs: 0993999338)">
        <i class="fa-solid fa-phone phone-icon"></i>
        <i class="fa-solid fa-xmark clear-icon" id="clearBtn" onclick="clearInput()"></i>
    </div>
    
    <button onclick="checkStatus()" id="searchBtn" class="search-btn">
        <span id="btnText">Sifarişi Tap</span>
        <i class="fa-solid fa-magnifying-glass" id="btnIcon"></i>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="error" id="errorMsg">
        <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> Aktiv sifariş tapılmadı.
    </div>

    <div class="result-card" id="resultCard">
        <h3><i class="fa-solid fa-box-open" style="color: var(--accent-gold);"></i> <span id="resName">Müştəri Adı</span></h3>
        
        <div class="result-line">
            <strong>Məhsul:</strong>
            <span id="resProduct">-</span>
        </div>
        <div class="result-line">
            <strong>Statusu:</strong>
            <span id="resStatus" class="status-badge">-</span>
        </div>
        <div class="result-line" id="trackTextAlani" style="display: none;">
            <strong>Poçt Kodu:</strong>
            <div>
                <span id="resTrackCode">-</span>
                <i class="fa-regular fa-copy copy-btn" onclick="copyTrackCode()" title="Kopyala"></i>
            </div>
        </div>
        
        <div id="poctAlani"></div>
    </div>

    <div class="social-footer">
        <a href="https://instagram.com/merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@merastore.az" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
    </div>
</div>

<a href="https://wa.me/994705849113" class="whatsapp-float" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
    // PRELOADER AYARI (1.1 saniyə sonra dərhal itir)
    window.addEventListener('load', () => {
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';
            }
        }, 1100);
    });

    const SHEET_ID = '1-JU5cstP4s3iNsDBCg_frl9JfrFGQYhNin6Sa6Boheo'; 
    const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&v=${Date.now()}`;

    const phoneInput = document.getElementById('phoneInput');
    const clearBtn = document.getElementById('clearBtn');

    phoneInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkStatus();
    });

    // "X" İKONUNUN ÇIXIB-İTMƏSİ
    phoneInput.addEventListener('input', function() {
        if (this.value.trim().length > 0) {
            clearBtn.style.display = 'block';
        } else {
            clearBtn.style.display = 'none';
        }
    });

    function clearInput() {
        phoneInput.value = '';
        clearBtn.style.display = 'none';
        phoneInput.focus();
    }

    function temizleNo(no) {
        let temiz = no.toString().replace(/\D/g, ''); 
        return temiz.length >= 9 ? temiz.slice(-9) : temiz; 
    }

    // 📋 TƏK KLİKLƏ KOPYALAMA FUNKSİYASI
    function copyTrackCode() {
        const code = document.getElementById('resTrackCode').innerText;
        navigator.clipboard.writeText(code).then(() => {
            alert('Poçt kodu kopyalandı: ' + code);
        }).catch(err => {
            console.error('Kopyalama xətası:', err);
        });
    }

    function checkStatus() {
        const inputVal = phoneInput.value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultCard = document.getElementById('resultCard');
        const poctAlani = document.getElementById('poctAlani');
        const trackTextAlani = document.getElementById('trackTextAlani');
        const resTrackCode = document.getElementById('resTrackCode');
        
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        if (!inputVal) return;

        btnText.style.opacity = '0.5';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'block';

        const klaviaturadanYazilan = temizleNo(inputVal);

        fetch(BASE_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                let found = false;

                for (let row of rows) {
                    if (!row.c[0]) continue;
                    
                    const cedveldekiNo = temizleNo(row.c[0].v);
                    
                    if (cedveldekiNo === klaviaturadanYazilan && klaviaturadanYazilan !== '') {
                        document.getElementById('resName').innerText = row.c[1] ? row.c[1].v : 'Hörmətli Müştəri';
                        document.getElementById('resProduct').innerText = row.c[2] ? row.c[2].v : '-';
                        
                        // Tam stabil Sheets statusu
                        document.getElementById('resStatus').innerText = row.c[4] ? row.c[4].v : '📦 Hazırlanır';

                        if (row.c[3] && row.c[3].v) {
                            const trackCode = row.c[3].v.toString().trim();
                            if (resTrackCode) resTrackCode.innerText = trackCode;
                            if (trackTextAlani) trackTextAlani.style.display = 'flex';
                            
                            if (poctAlani) {
                                // QƏŞƏNG YENİ DÜYMƏNİN STRUKTURU
                                poctAlani.innerHTML = `<a href="https://www.azerpost.az/az/xidmetler/gonderislerin-izlenmesi?package_id=${trackCode}" target="_blank" class="post-link"><i class="fa-solid fa-truck-fast"></i> AzerPost Canlı İzlə</a>`;
                            }
                        } else {
                            if (trackTextAlani) trackTextAlani.style.display = 'none';
                            if (poctAlani) poctAlani.innerHTML = '';
                        }
                        
                        resultCard.style.display = 'block';
                        errorMsg.style.display = 'none';
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    resultCard.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            })
            .catch((err) => {
                console.error(err);
                alert('Sistemdə xəta baş verdi.');
            })
            .finally(() => {
                btnText.style.opacity = '1';
                btnIcon.style.display = 'block';
                btnSpinner.style.display = 'none';
            });
    }
</script>

</body>
</html>
